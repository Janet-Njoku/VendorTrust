[project]
name = "vendortrust-api"
version = "0.0.1"
description = "VendorTrust API: third-party security due diligence and control validation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    # Required by starlette.testclient (Starlette 1.10 documents httpx2 as the TestClient
    # dependency and deprecates the httpx fallback). Maintained by the pydantic org. Dev only:
    # it is not in the production dependency set. See docs/dependency-notes.md.
    "httpx2>=2.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S105", "S106", "S107"]  # fake credentials only
# SQL-heavy files: long SQL string literals, constant-SQL f-strings (no user input), a seeded RNG
"tests/db/**" = ["E501", "PT018", "S608", "S311", "RUF005", "RUF015"]
"tests/test_scoring.py" = ["S311", "RUF005"]
"tests/test_dev_auth.py" = ["PT018", "E501"]
"tests/test_credential_guard.py" = ["PT018", "E501"]
"alembic/versions/**" = ["E501", "S608"]
# the only interpolation is the module-level COLUMNS constant; every value is a bound parameter
"app/routers/*.py" = ["S608"]
# question text is content, not code
"app/questionnaire_starter.py" = ["E501"]
"app/questionnaires.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = ["db: needs the local PostgreSQL test cluster (scripts/dev-db.sh init)"]
pythonpath = ["."]
