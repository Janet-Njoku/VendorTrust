# Alembic configuration. There is deliberately NO database URL here: migrations load the
# vt_migrator credential through app.credentials (outside the repo, on demand).
#
#   uv run alembic upgrade head                 dry run: applies, then ROLLS BACK
#   uv run alembic -x commit=1 upgrade head     really apply
#   uv run alembic upgrade head --sql           render SQL only (no connection, no credential)
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
